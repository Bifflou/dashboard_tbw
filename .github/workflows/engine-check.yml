name: Engine check

# Runs the engine on the test fixtures with the real API keys and compares with the old dashboards.
# Never commits anything: outputs stay in tests/output/ on the runner. Results are posted as annotations.
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/fixtures/**'
      - 'config/**'
      - '.github/workflows/engine-check.yml'
  workflow_dispatch:
    inputs:
      fixtures:
        description: 'Fixture names to run (space separated, empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: engine-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check API keys are available
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          if [ -z "$ETHERSCAN_API_KEY" ]; then echo "::error title=Secrets::ETHERSCAN_API_KEY is not set"; else echo "ETHERSCAN_API_KEY present"; fi

      - name: Run engine check
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          FIXTURES: ${{ inputs.fixtures }}
        run: python -m scripts.check_engine $FIXTURES
